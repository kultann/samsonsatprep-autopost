name: autopost

on:
  schedule:
    - cron: "7 * * * *"   # every hour at :07 (UTC); posts go out at the first run after publish_at
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (log only, post nothing)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: autopost
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Post what's due
        env:
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY }}
          PRUNE_VIDEOS_AFTER_HOURS: ${{ vars.PRUNE_VIDEOS_AFTER_HOURS }}
          MEDIA_BASE_URL: ${{ vars.MEDIA_BASE_URL }}
          MAX_SHORTS_PER_RUN: ${{ vars.MAX_SHORTS_PER_RUN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          YT_LONGFORM: ${{ vars.YT_LONGFORM }}
          YT_CAPTIONS: ${{ vars.YT_CAPTIONS }}
          LONGFORM_UPLOAD_LEAD_HOURS: ${{ vars.LONGFORM_UPLOAD_LEAD_HOURS }}
          LONGFORM_MIN_GAP_HOURS: ${{ vars.LONGFORM_MIN_GAP_HOURS }}
          LONGFORM_VIDEO_BASE: ${{ vars.LONGFORM_VIDEO_BASE }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
          NEW_SECRETS_FILE: ${{ runner.temp }}/new_secrets.env
        run: python -m autopost.runner

      - name: Save rotated tokens
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          FILE: ${{ runner.temp }}/new_secrets.env
        run: |
          [ -s "$FILE" ] || exit 0
          while IFS='=' read -r name value; do
            echo "::add-mask::$value"
            gh secret set "$name" --body "$value" --repo "$GITHUB_REPOSITORY"
            echo "updated $name"
          done < "$FILE"
          rm -f "$FILE"

      - name: Commit posting log
        if: always()
        run: |
          git config user.name "autopost-bot"
          git config user.email "autopost-bot@users.noreply.github.com"
          git add state/posted.json 2>/dev/null || exit 0
          git add state/cooldown.json 2>/dev/null || true   # platform pauses (see config.COOLDOWN_FILE)
          git add -A posts   # short videos pruned after they're posted everywhere
          git diff --cached --quiet && exit 0
          git commit -m "log: posted $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
